<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="nsKidsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nsKidsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="nsKidsMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Friendly Soft Rounded Squircle -->
  <rect x="4" y="4" width="152" height="152" rx="44" fill="url(#nsKidsBg)" stroke="#f59e0b" stroke-width="5"/>

  <!-- Playful Stars & Dots -->
  <circle cx="130" cy="30" r="5" fill="#fbbf24"/>
  <circle cx="30" cy="130" r="4" fill="#34d399"/>
  <circle cx="135" cy="130" r="4" fill="#60a5fa"/>

  <!-- Soft Rounded Orange N -->
  <path d="M 30 115 V 45 L 72 115 V 45" 
        fill="none" 
        stroke="url(#nsKidsOrange)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Soft Rounded Mint Green S -->
  <path d="M 130 58 C 130 42, 92 42, 92 60 C 92 82, 130 82, 130 102 C 130 118, 92 118, 92 102" 
        fill="none" 
        stroke="url(#nsKidsMint)" 
        stroke-width="20" 
        stroke-linecap="round"/>
</svg>
