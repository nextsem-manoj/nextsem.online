name: Automated Flutter Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (production, internal, beta)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - beta
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-android.yml'

jobs:
  build-and-deploy:
    name: Build & Publish Flutter .aab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p mobile/android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/nextsem-release-key.keystore
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret is missing. Build may fail if keystore is not present."
          fi

      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Signed Release App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/nextsem-release-key.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'nextsem123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'nextsem-alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'nextsem123' }}
        run: |
          cd mobile
          flutter build appbundle --release --target-platform android-arm,android-arm64

      - name: Upload .aab Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Google Play Store
        if: env.HAS_PLAY_SECRET != ''
        env:
          HAS_PLAY_SECRET: ${{ secrets.PLAY_STORE_JSON_KEY }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: online.nextsem.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: completed
