<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Mastery | NextSem Online</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #17181c;
      --bg-secondary: #1e2430;
      --bg-card: #1e2430;
      --bg-card-hover: #262d3d;
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-yellow: #f7df1e;
      --accent-blue: #38bdf8;
      --accent-green: #04AA6D;
      --accent-green-hover: #039861;
      --accent-purple: #c084fc;
      --border-color: #2e3748;
      --sidebar-width: 300px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.5);
    }

    .light {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    /* Accessibility Focus Style */
    *:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sticky Sidebar Navigation */
    aside.sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .sidebar-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background-color: var(--bg-secondary);
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      background: var(--accent-yellow);
      color: #000000;
      font-weight: 900;
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(247, 223, 30, 0.4);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    /* Sidebar Search Input */
    .search-box {
      padding: 1rem 1.25rem 0.5rem;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 0.85rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .search-input {
      width: 100%;
      padding: 0.55rem 0.75rem 0.55rem 2.25rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      outline: none;
    }

    .sidebar-nav {
      padding: 0.5rem 0 2rem;
      flex: 1;
    }

    .nav-section-title {
      padding: 1rem 1.5rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border-left: 3px solid transparent;
      cursor: pointer;
      user-select: none;
    }

    .nav-item:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-primary);
      transform: translateX(2px);
    }

    .nav-item.active {
      background-color: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border-left-color: var(--accent-blue);
      font-weight: 700;
    }

    .nav-item i.check-icon {
      margin-left: auto;
      color: var(--accent-green);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .nav-item.completed i.check-icon {
      opacity: 1;
    }

    /* Main Content */
    main.main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      max-width: 1050px;
      padding: 1.5rem 2.5rem 4rem;
      width: calc(100% - var(--sidebar-width));
    }

    /* Top Progress Bar */
    .course-progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .course-progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Bar */
    header.top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1rem;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .breadcrumbs a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      color: var(--accent-blue);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .control-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .control-btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-blue);
    }

    .control-btn.bookmarked i {
      color: var(--accent-yellow);
    }

    /* Lesson Typography & Metadata */
    .lesson-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-yellow {
      background: rgba(247, 223, 30, 0.15);
      color: #f7df1e;
      border: 1px solid rgba(247, 223, 30, 0.3);
    }

    .badge-blue {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-green {
      background: rgba(4, 170, 109, 0.15);
      color: #4ade80;
      border: 1px solid rgba(4, 170, 109, 0.3);
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .meta-item {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
    }

    .lesson-title {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .lesson-lead {
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-weight: 400;
    }

    /* High Contrast White Heading Standard */
    .lesson-body h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin: 2.25rem 0 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .light .lesson-body h2 {
      color: #0f172a;
    }

    .lesson-body p {
      margin-bottom: 1.25rem;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
    }

    .lesson-body strong {
      color: #ffffff;
      font-weight: 700;
    }

    .light .lesson-body strong {
      color: #0f172a;
    }

    .lesson-body ul, .lesson-body ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: var(--text-secondary);
    }

    .lesson-body li {
      margin-bottom: 0.6rem;
      line-height: 1.6;
    }

    /* Vibrant Underlined Green Link Standard */
    .lesson-body a, .green-link {
      color: var(--accent-green) !important;
      text-decoration: underline !important;
      text-decoration-color: var(--accent-green) !important;
      font-weight: 600 !important;
    }

    .lesson-body a:hover, .green-link:hover {
      color: var(--accent-green-hover) !important;
    }

    code:not(pre code) {
      font-family: var(--font-mono);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.88em;
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Callouts */
    .callout {
      padding: 1.25rem 1.5rem;
      border-radius: var(--radius-md);
      margin: 1.75rem 0;
      display: flex;
      gap: 1rem;
      border-left: 4px solid;
      background: var(--bg-card);
    }

    .callout-info {
      background: rgba(56, 189, 248, 0.08);
      border-color: var(--accent-blue);
    }

    .callout-tip {
      background: rgba(4, 170, 109, 0.08);
      border-color: var(--accent-green);
    }

    .callout-warning {
      background: rgba(247, 223, 30, 0.08);
      border-color: var(--accent-yellow);
    }

    .callout-icon {
      font-size: 1.3rem;
    }

    .callout-info .callout-icon { color: var(--accent-blue); }
    .callout-tip .callout-icon { color: var(--accent-green); }
    .callout-warning .callout-icon { color: var(--accent-yellow); }

    .callout-title {
      font-weight: 800;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    /* Code Editor Playground */
    .code-editor-card {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 2rem 0;
      box-shadow: var(--shadow-lg);
    }

    .editor-header {
      background: #111827;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    .editor-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .editor-file-title {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }

    .btn-run {
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 2px 6px rgba(4, 170, 109, 0.4);
    }

    .btn-run:hover {
      background: var(--accent-green-hover);
      transform: translateY(-1px);
    }

    .btn-run:active {
      transform: translateY(0);
    }

    .code-textarea {
      width: 100%;
      background: #0d1322;
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.6;
      padding: 1.25rem;
      border: none;
      resize: vertical;
      min-height: 220px;
      outline: none;
      tab-size: 2;
    }

    .console-output {
      background: #030712;
      border-top: 1px solid #1f2937;
      padding: 1rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }

    .console-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .console-logs {
      color: #4ade80;
      white-space: pre-wrap;
      min-height: 48px;
    }

    .console-logs.error {
      color: #f87171;
    }

    /* Knowledge Check Section UI */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 2rem;
      margin: 3rem 0 2rem;
      box-shadow: var(--shadow-md);
    }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .quiz-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-primary);
    }

    .quiz-step-meta {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .quiz-question {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 1rem 1.35rem;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1.4;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--accent-blue);
      background-color: var(--bg-card-hover);
      transform: translateX(4px);
    }

    .option-btn[disabled] {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .option-btn.correct {
      border-color: var(--accent-green) !important;
      background: rgba(4, 170, 109, 0.15) !important;
      color: #4ade80 !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.15) !important;
      color: #f87171 !important;
    }

    .quiz-explanation {
      display: none;
      padding: 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .quiz-explanation.show-correct {
      display: block;
      background: rgba(4, 170, 109, 0.12);
      border: 1px solid var(--accent-green);
      color: var(--text-primary);
    }

    .quiz-explanation.show-wrong {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: var(--text-primary);
    }

    .quiz-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-next-question {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-next-question:hover {
      background: #1d4ed8;
    }

    .quiz-countdown-banner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1.25rem;
      margin-top: 1rem;
    }

    .countdown-text {
      font-size: 0.92rem;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .countdown-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
    }

    .countdown-progress-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-yellow);
      border-radius: 2px;
    }

    /* Quiz Summary Results Card */
    .quiz-results-card {
      text-align: center;
      padding: 1.5rem 1rem;
    }

    .results-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .results-score-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .results-badge-wrap {
      margin-bottom: 1.5rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 2rem 0;
    }

    .result-stat-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: var(--radius-sm);
    }

    .result-stat-num {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .result-stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-retry-quiz {
      background: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-retry-quiz:hover {
      transform: translateY(-2px);
    }

    /* Footer Pagination */
    .lesson-footer-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      gap: 1.5rem;
    }

    .nav-card {
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1.25rem 1.5rem;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      width: 48%;
      cursor: pointer;
    }

    .nav-card:hover:not(.disabled) {
      border-color: var(--accent-blue);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .nav-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .nav-card-dir {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .nav-card-title {

        contentHtml: `
          <h2>⏳ Asynchronous JavaScript & Promises</h2>
          <p>Asynchronous operations allow your web application on 🪟 Windows 11 and server backends to perform non-blocking tasks (like network API fetches and file reads) without freezing the browser user interface.</p>

          <p>A <strong>Promise</strong> represents a value that may be available now, in the future, or never. Promises exist in one of three states:</p>
          <ul>
            <li><strong>Pending:</strong> Initial state before outcome is determined.</li>
            <li><strong>Fulfilled (Resolved):</strong> Operation completed successfully with result value.</li>
            <li><strong>Rejected:</strong> Operation failed with an error exception.</li>
          </ul>

          <h2>🚀 Modern <code>async/await</code> & Error Handling</h2>
          <p>The ES2017 <code>async/await</code> syntax builds on top of Promises, allowing developers to write asynchronous code that reads like clean synchronous lines:</p>
          <ul>
            <li>Mark functions with <code>async</code> to enable the <code>await</code> keyword inside them.</li>
            <li>Wrap network calls inside <code>try { const res = await fetch(url); const data = await res.json(); } catch(err) { ... }</code> for robust exception handling.</li>
          </ul>

          <div class="callout callout-warning" style="border-left-color: var(--accent-yellow); margin-top: 1.5rem;">
            <div class="callout-icon" style="color: var(--accent-yellow);"><i class="fa-solid fa-laptop-code"></i></div>

              <p style="margin-bottom: 0.5rem;"><strong>Task Objective:</strong> Async Data Loader with try...catch.</p>
              <p style="margin: 0;">In the <strong>Live Code Playground</strong> below, create an <code>async function loadUser()</code> that awaits a Promise resolving after 300ms, logged inside a <code>try...catch</code> block!</p>
            </div>
          </div>
        `,

  setTimeout(() => resolve({ username: "dev_pro", role: "Full Stack Engineer" }), 300);

  } catch (err) {

}

        lead: "Interact with the Document Object Model (DOM) to handle click events, query elements, update styles, and build dynamic UIs.",
        contentHtml: `
          <h2>🌐 The Document Object Model (DOM)</h2>
          <p>The <strong>Document Object Model (DOM)</strong> represents the structure of an HTML document as a dynamic tree of node objects in memory. JavaScript interacts with the DOM to build responsive, single-page web applications.</p>

          <h2>🎯 Selecting & Modifying Elements</h2>
          <ul>
            <li><strong><code>document.querySelector(selector)</code>:</strong> Selects the first HTML element matching a CSS selector (e.g. <code>#submitBtn</code> or <code>.card-title</code>).</li>
            <li><strong><code>document.querySelectorAll(selector)</code>:</strong> Returns a static <code>NodeList</code> of all matching elements.</li>
            <li><strong>Updating Content & Classes:</strong> Modify text using <code>el.textContent = "New Text"</code> and manage CSS classes using <code>el.classList.add()</code>, <code>.remove()</code>, or <code>.toggle()</code>.</li>
          </ul>

          <h2>🖱️ Event Handling & Delegation</h2>
          <p>Register user interactions using <code>element.addEventListener('click', (event) => { ... })</code>.</p>

          <h2>💾 Web Storage APIs: Client State Persistence</h2>
          <p>Web Storage APIs allow browser applications running on 🪟 Windows 11 to persist key-value pairs directly inside user browser storage.</p>

          <ul>
            <li><strong><code>localStorage</code>:</strong> Persistent key-value storage that survives browser restarts and OS reboots. Data never expires until explicitly cleared.</li>
            <li><strong><code>sessionStorage</code>:</strong> Temporary storage scoped strictly to the current browser tab session. Data is cleared automatically when the tab or window is closed.</li>
          </ul>

          <h2>🔄 JSON Serialization (<code>JSON.stringify</code> &amp; <code>JSON.parse</code>)</h2>
          <p>Web Storage APIs can ONLY store string primitives! To save complex JavaScript Objects or Arrays:</p>
          <ul>
            <li><strong><code>JSON.stringify(object)</code>:</strong> Converts JavaScript objects into JSON-formatted text strings for storage.</li>
            <li><strong><code>JSON.parse(jsonString)</code>:</strong> Deserializes stored JSON strings back into live JavaScript object instances.</li>
          </ul>

          <div class="callout callout-warning">
            <div class="callout-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div>
              <div class="callout-title">⚠️ Storage Quotas & Security Best Practices</div>
              <p style="margin:0;">Web Storage is capped at <strong>~5MB</strong> per origin domain. Never store unencrypted passwords, secret API keys, or sensitive personal data in <code>localStorage</code> because client-side scripts can access it!</p>
            </div>
          </div>

          <div class="callout callout-warning" style="border-left-color: var(--accent-yellow); margin-top: 1.5rem;">
            <div class="callout-icon" style="color: var(--accent-yellow);"><i class="fa-solid fa-laptop-code"></i></div>

              <p style="margin: 0;">In the <strong>Live Code Playground</strong> below, convert <code>{ theme: "dark", score: 95 }</code> to a JSON string using <code>JSON.stringify()</code>, then parse it back using <code>JSON.parse()</code>!</p>
            </div>
          </div>
        `,
        defaultCode: `// 🎯 HANDS-ON TASK: Serialize & Deserialize Data
const userPreferences = {
  theme: "dark",

          <h2>🛡️ Fault-Tolerant Code with <code>try...catch...finally</code></h2>
          <p>Uncaught runtime errors crash web applications and freeze user interfaces. The <code>try...catch...finally</code> architecture catches exceptions gracefully and prevents application failure on 🪟 Windows browsers.</p>

          <ul>
            <li><strong><code>try { ... }</code>:</strong> Encloses risky code blocks that might throw exceptions (such as network API fetches or JSON parsing).</li>
            <li><strong><code>catch (err) { ... }</code>:</strong> Executes automatically when an error is thrown inside the try block. Access error details via <code>err.name</code>, <code>err.message</code>, and <code>err.stack</code>.</li>
            <li><strong><code>finally { ... }</code>:</strong> Code block that executes ALWAYS regardless of whether an exception occurred or not (perfect for hiding loading spinners or closing connections).</li>
          </ul>

          <ul>
            <li><strong>Common Error Types:</strong> <code>TypeError</code>, <code>ReferenceError</code>, <code>SyntaxError</code>, <code>RangeError</code>.</li>

                <li><code>400 Bad Request</code> / <code>401 Unauthorized</code> / <code>404 Not Found</code>: Client-side errors.</li>
                <li><code>500 Internal Server Error</code>: Backend server errors.</li>

          {

              { text: "B) Database engine", isCorrect: false },

            ],
            explanation: "Vite provides extremely fast dev server startup and optimized production bundling."
          },
          {

              { text: "C) load 'express';", isCorrect: false },

            ],
            explanation: "CommonJS uses `const pkg = require('pkg_name')` for module loading."
          },
          {
            question: "10. Why should `node_modules/` folder be listed in `.gitignore` file?",
            options: [
              { text: "A) It contains thousands of downloaded dependency files that can be reinstalled easily via `npm install`", isCorrect: true },
              { text: "B) It contains private passwords", isCorrect: false },
              { text: "C) Git cannot track folders", isCorrect: false },
              { text: "D) It breaks Windows OS", isCorrect: false }
            ],
            explanation: "Excluding `node_modules/` keeps Git repositories lightweight; dependencies are restored via `npm install`."
          }
        ]
      }
    ];

    // ----------------------------------------------------
    // STATE MANAGEMENT & LOCAL STORAGE
    // ----------------------------------------------------
    let currentLessonIndex = 0;
    let completedLessons = JSON.parse(localStorage.getItem('js_completed_lessons') || '[]');
    let bookmarkedLessons = JSON.parse(localStorage.getItem('js_bookmarks') || '[]');

    // Quiz Execution State for current lesson
    let activeQuizQuestions = [];
    let currentQuizStep = 0;
    let quizUserAnswers = []; // stores { questionIdx, selectedIdx, isCorrect }
    let autoAdvanceTimer = null;
    let countdownInterval = null;

    function clearQuizTimers() {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    // ----------------------------------------------------
    // INITIALIZATION & EVENT LISTENERS
    // ----------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // Restore Theme
      const savedTheme = localStorage.getItem('js_theme') || 'dark';
      setTheme(savedTheme);

      // Check URL Hash for specific lesson (e.g. #variables-scope)
      const hash = window.location.hash.replace('#', '');
      const foundIdx = LESSONS.findIndex(l => l.id === hash);
      if (foundIdx !== -1) {
        currentLessonIndex = foundIdx;
      }

      renderSidebar();
      loadLesson(currentLessonIndex);
      updateOverallProgress();
    });

    // ----------------------------------------------------
    // RENDER SIDEBAR & SEARCH
    // ----------------------------------------------------
    function renderSidebar(filteredLessons = null) {
      const navEl = document.getElementById('sidebarNav');
      navEl.innerHTML = '';

      const lessonsToRender = filteredLessons || LESSONS;
      let currentMod = '';

      lessonsToRender.forEach((lesson) => {
        const globalIdx = LESSONS.findIndex(l => l.id === lesson.id);

        if (lesson.module !== currentMod) {
          currentMod = lesson.module;
          const sectionTitle = document.createElement('div');
          sectionTitle.className = 'nav-section-title';
          sectionTitle.textContent = currentMod;
          navEl.appendChild(sectionTitle);
        }

        const isCompleted = completedLessons.includes(lesson.id);
        const isActive = globalIdx === currentLessonIndex;

        const navItem = document.createElement('a');
        navItem.className = `nav-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
        navItem.setAttribute('role', 'button');
        navItem.setAttribute('aria-current', isActive ? 'page' : 'false');
        navItem.onclick = () => {
          loadLesson(globalIdx);
          toggleMobileSidebar(false);
        };

        navItem.innerHTML = `
          <i class="fa-solid fa-code" style="font-size: 0.85rem;"></i>
          <span>${lesson.title}</span>
          <i class="fa-solid fa-check check-icon" title="Passed Knowledge Check"></i>
        `;

        navEl.appendChild(navItem);
      });
    }

    function filterLessons() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = LESSONS.filter(l => 
        l.title.toLowerCase().includes(query) || 
        l.module.toLowerCase().includes(query) ||
        l.lead.toLowerCase().includes(query)
      );
      renderSidebar(filtered);
    }

    // ----------------------------------------------------
    // LOAD & RENDER LESSON CONTENT
    // ----------------------------------------------------
    function loadLesson(index) {
      if (index < 0 || index >= LESSONS.length) return;

      clearQuizTimers();
      currentLessonIndex = index;
      const lesson = LESSONS[index];

      // Update Hash
      window.location.hash = lesson.id;

      // Update Breadcrumbs & Meta
      document.getElementById('breadcrumbModule').textContent = lesson.module.split(':')[0];
      document.getElementById('breadcrumbTitle').textContent = lesson.title.replace(/^\d+\.\s*/, '');
      
      document.getElementById('lessonDifficulty').innerHTML = `<i class="fa-solid fa-star"></i> ${lesson.badge}`;
      document.getElementById('lessonReadTime').innerHTML = `<i class="fa-regular fa-clock"></i> ${lesson.readTime}`;
      const currentNumStr = String(index + 1).padStart(2, '0');
      const totalNumStr = String(LESSONS.length).padStart(2, '0');
      document.getElementById('lessonNumber').innerHTML = `<i class="fa-solid fa-book-open"></i> Lesson ${currentNumStr} of ${totalNumStr}`;

      document.getElementById('lessonTitle').textContent = lesson.title;
      document.getElementById('lessonLead').textContent = lesson.lead;
      document.getElementById('lessonBody').innerHTML = lesson.contentHtml;

      // Load Playground Code (restore custom edited code if saved, else default to task)
      const savedCode = localStorage.getItem(`js_code_${lesson.id}`);
      const codeToLoad = (savedCode && savedCode.includes('HANDS-ON TASK')) ? savedCode : lesson.defaultCode;
      document.getElementById('codePlayground').value = codeToLoad;
      document.getElementById('consoleLogs').textContent = 'Click "Run Code" to execute code in console.';
      document.getElementById('consoleLogs').className = 'console-logs';
      document.getElementById('consoleStatus').textContent = 'Ready';
      document.getElementById('consoleStatus').style.color = 'var(--accent-blue)';

      // Initialize Chapter Knowledge Check Quiz
      initChapterQuiz(lesson);

      // Update Footer Nav Buttons
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (index === 0) {
        prevBtn.classList.add('disabled');
        document.getElementById('prevTitle').textContent = 'First Lesson';
      } else {
        prevBtn.classList.remove('disabled');
        document.getElementById('prevTitle').textContent = LESSONS[index - 1].title;
      }

      if (index === LESSONS.length - 1) {
        nextBtn.classList.add('disabled');
        document.getElementById('nextTitle').textContent = 'Final Lesson';
      } else {
        nextBtn.classList.remove('disabled');
        document.getElementById('nextTitle').textContent = LESSONS[index + 1].title;
      }

      // Bookmark Button State
      updateBookmarkButtonState();

      // Refresh Sidebar Active Highlight
      renderSidebar();

      // Scroll top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateLesson(direction) {
      const targetIdx = currentLessonIndex + direction;
      if (targetIdx >= 0 && targetIdx < LESSONS.length) {
        loadLesson(targetIdx);
      }
    }

    // ----------------------------------------------------
    // INTERACTIVE CODE PLAYGROUND
    // ----------------------------------------------------
    function resetTaskCode() {
      const lesson = LESSONS[currentLessonIndex];
      localStorage.removeItem(`js_code_${lesson.id}`);
      document.getElementById('codePlayground').value = lesson.defaultCode;
      document.getElementById('consoleLogs').textContent = 'Code reset to default task template. Click "Run Code" to execute.';
      document.getElementById('consoleLogs').className = 'console-logs';
      document.getElementById('consoleStatus').textContent = 'Reset';
      document.getElementById('consoleStatus').style.color = 'var(--accent-yellow)';
    }

    function runPlaygroundCode() {
      const code = document.getElementById('codePlayground').value;
      const logsEl = document.getElementById('consoleLogs');
      const statusEl = document.getElementById('consoleStatus');
      const lesson = LESSONS[currentLessonIndex];

      // Save user edited code to LocalStorage
      localStorage.setItem(`js_code_${lesson.id}`, code);

      // Loading state
      statusEl.textContent = 'Running...';
      statusEl.style.color = 'var(--accent-yellow)';
      logsEl.className = 'console-logs';
      logsEl.textContent = '⏳ Executing JavaScript...';

      setTimeout(() => {
        let logs = [];
        const customConsole = {
          log: (...args) => {
            logs.push(args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg).join(' '));
          },
          error: (...args) => {
            logs.push('❌ ' + args.join(' '));
          },
          warn: (...args) => {
            logs.push('⚠️ ' + args.join(' '));
          }
        };

        try {
          const runFn = new Function('console', 'document', 'window', code);
          runFn(customConsole, document, window);
          
          statusEl.textContent = 'Success (0 Errors)';
          statusEl.style.color = '#4ade80';
          logsEl.className = 'console-logs';
          logsEl.textContent = logs.length > 0 ? logs.join('\n') : '✅ Code executed successfully with no console output.';
        } catch (err) {
          statusEl.textContent = 'Runtime Error';
          statusEl.style.color = '#ef4444';
          logsEl.className = 'console-logs error';
          logsEl.textContent = '❌ Runtime Exception:\n' + (err.stack || err.message);
        }
      }, 250);
    }

    // ----------------------------------------------------
    // CHAPTER KNOWLEDGE CHECK QUIZ ENGINE (10 MCQs)
    // ----------------------------------------------------
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function shuffleArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function initChapterQuiz(lesson) {
      clearQuizTimers();
      // Deep clone and shuffle questions + option positions
      activeQuizQuestions = shuffleArray(lesson.questions).map(q => ({
        ...q,
        options: shuffleArray(q.options)
      }));
      currentQuizStep = 0;
      quizUserAnswers = [];

      renderQuizQuestionStep();
    }

    function renderQuizQuestionStep() {
      clearQuizTimers();
      const quizSection = document.getElementById('quizSection');
      const totalQ = activeQuizQuestions.length;

      if (currentQuizStep >= totalQ) {
        renderQuizResults();
        return;
      }

      const q = activeQuizQuestions[currentQuizStep];
      const isLast = currentQuizStep === totalQ - 1;
      const cleanQuestionText = q.question.replace(/^\d+\.\s*/, '');
      const prefixes = ['A', 'B', 'C', 'D'];

      quizSection.innerHTML = `
        <div class="quiz-header">
          <div class="quiz-title">
            <i class="fa-solid fa-circle-question" style="color: var(--accent-yellow);"></i>
            <span>Knowledge Check: Question ${currentQuizStep + 1} of ${totalQ}</span>
          </div>
          <span class="quiz-step-meta">Passing Threshold: 70%</span>
        </div>

        <p class="quiz-question">${currentQuizStep + 1}. ${escapeHtml(cleanQuestionText)}</p>

        <div class="quiz-options" id="stepOptions">
          ${q.options.map((opt, idx) => {
            const cleanOptText = opt.text.replace(/^[A-D]\)\s*/, '');
            const prefix = prefixes[idx] || '';
            return `
              <button class="option-btn" onclick="handleOptionSelect(${idx})">
                <span>${prefix ? prefix + ') ' : ''}${escapeHtml(cleanOptText)}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="quiz-explanation" id="stepExplanation"></div>

        <div class="quiz-countdown-banner" id="stepCountdown" style="display: none;">
          <div class="countdown-text" id="countdownText"></div>
          <div class="countdown-progress-bar">
            <div class="countdown-progress-fill" id="countdownFill"></div>
          </div>
        </div>
      `;
    }

    function handleOptionSelect(selectedOptionIdx) {
      clearQuizTimers();
      const q = activeQuizQuestions[currentQuizStep];
      const totalQ = activeQuizQuestions.length;
      const isLast = currentQuizStep === totalQ - 1;
      const optionBtns = document.querySelectorAll('#stepOptions .option-btn');
      const expEl = document.getElementById('stepExplanation');
      const countdownEl = document.getElementById('stepCountdown');
      const countdownTextEl = document.getElementById('countdownText');
      const countdownFillEl = document.getElementById('countdownFill');

      // Disable all option buttons immediately
      optionBtns.forEach(btn => btn.disabled = true);

      const isCorrect = q.options[selectedOptionIdx].isCorrect;
      quizUserAnswers.push({
        question: q.question,
        selectedOptionIdx,
        isCorrect
      });

      if (isCorrect) {
        optionBtns[selectedOptionIdx].classList.add('correct');
        expEl.className = 'quiz-explanation show-correct';
        expEl.innerHTML = `🎉 <strong>Correct Answer!</strong><br>${escapeHtml(q.explanation)}`;
      } else {
        optionBtns[selectedOptionIdx].classList.add('wrong');
        expEl.className = 'quiz-explanation show-wrong';
        expEl.innerHTML = `❌ <strong>Incorrect Answer.</strong><br>${escapeHtml(q.explanation)}`;

        // Highlight correct answer
        const correctIdx = q.options.findIndex(o => o.isCorrect);
        if (correctIdx !== -1 && optionBtns[correctIdx]) {
          optionBtns[correctIdx].classList.add('correct');
        }
      }

      expEl.style.display = 'block';

      // Setup 3-second automatic advance countdown
      let secondsLeft = 3;
      const targetLabel = isLast ? 'Quiz Result' : 'next question';
      
      countdownTextEl.innerHTML = `⏳ Moving to <strong>${targetLabel}</strong> in <strong>${secondsLeft}</strong> seconds...`;
      countdownEl.style.display = 'flex';
      
      if (countdownFillEl) {
        countdownFillEl.style.transition = 'none';
        countdownFillEl.style.width = '100%';
        setTimeout(() => {
          if (countdownFillEl) {
            countdownFillEl.style.transition = 'width 3s linear';
            countdownFillEl.style.width = '0%';
          }
        }, 10);
      }

      countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          countdownTextEl.innerHTML = `⏳ Moving to <strong>${targetLabel}</strong> in <strong>${secondsLeft}</strong> seconds...`;
        } else {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }, 1000);

      autoAdvanceTimer = setTimeout(() => {
        advanceQuizStep();
      }, 3000);
    }

    function advanceQuizStep() {
      clearQuizTimers();
      currentQuizStep++;
      renderQuizQuestionStep();
    }

    function renderQuizResults() {
      const quizSection = document.getElementById('quizSection');
      const total = activeQuizQuestions.length;
      const correctCount = quizUserAnswers.filter(a => a.isCorrect).length;
      const incorrectCount = total - correctCount;
      const scorePct = Math.round((correctCount / total) * 100);
      const passed = scorePct >= 70;

      const lesson = LESSONS[currentLessonIndex];

      // Save high score and completion state if passed
      localStorage.setItem(`js_quiz_score_${lesson.id}`, scorePct);
      if (passed && !completedLessons.includes(lesson.id)) {
        completedLessons.push(lesson.id);
        localStorage.setItem('js_completed_lessons', JSON.stringify(completedLessons));
        updateOverallProgress();
        renderSidebar();

        // Check if all lessons passed
        if (completedLessons.length === LESSONS.length) {
          setTimeout(() => toggleCertModal(true), 800);
        }
      }

      quizSection.innerHTML = `
        <div class="quiz-results-card">
          <div class="results-icon">${passed ? '🎉' : '❌'}</div>
          <h2 class="results-score-title">${scorePct}% Score</h2>
          
          <div class="results-badge-wrap">
            <span class="badge ${passed ? 'badge-green' : 'badge-red'}" style="font-size: 0.95rem; padding: 0.4rem 1.2rem;">
              <i class="fa-solid ${passed ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> 
              ${passed ? 'CHAPTER PASSED! (>= 70%)' : 'NEEDS IMPROVEMENT (< 70%)'}
            </span>
          </div>

          <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 1.5rem;">
            ${passed 
              ? 'Awesome job! You demonstrated strong mastery of this chapter.' 
              : 'Don\'t worry! Review the lesson material above and retry the quiz to pass.'}
          </p>

          <div class="results-grid">
            <div class="result-stat-box">
              <div class="result-stat-num" style="color: var(--text-primary);">${total}</div>
              <div class="result-stat-label">Total Questions</div>
            </div>
            <div class="result-stat-box">
              <div class="result-stat-num" style="color: #4ade80;">${correctCount}</div>
              <div class="result-stat-label">Correct Answers</div>
            </div>
            <div class="result-stat-box">
              <div class="result-stat-num" style="color: #f87171;">${incorrectCount}</div>
              <div class="result-stat-label">Incorrect Answers</div>
            </div>
          </div>

          <button class="btn-retry-quiz" onclick="initChapterQuiz(LESSONS[currentLessonIndex])">
            <i class="fa-solid fa-rotate-right"></i> Retry Quiz (Shuffled)
          </button>
        </div>
      `;
    }

    // ----------------------------------------------------
    // PROGRESS & BADGE UPDATES
    // ----------------------------------------------------
    function updateOverallProgress() {
      const percentage = Math.round((completedLessons.length / LESSONS.length) * 100);
      document.getElementById('courseProgressBar').style.width = `${percentage}%`;
      document.getElementById('scoreText').textContent = `${completedLessons.length} / ${LESSONS.length} PASSED`;
    }

    // ----------------------------------------------------
    // BOOKMARK TOGGLE
    // ----------------------------------------------------
    function toggleBookmark() {
      const lesson = LESSONS[currentLessonIndex];
      const idx = bookmarkedLessons.indexOf(lesson.id);
      if (idx === -1) {
        bookmarkedLessons.push(lesson.id);
      } else {
        bookmarkedLessons.splice(idx, 1);
      }
      localStorage.setItem('js_bookmarks', JSON.stringify(bookmarkedLessons));
      updateBookmarkButtonState();
    }

    function updateBookmarkButtonState() {
      const lesson = LESSONS[currentLessonIndex];
      const isBookmarked = bookmarkedLessons.includes(lesson.id);
      const btn = document.getElementById('bookmarkBtn');
      const icon = btn.querySelector('i');
      const text = document.getElementById('bookmarkText');

      if (isBookmarked) {
        btn.classList.add('bookmarked');
        icon.className = 'fa-solid fa-bookmark';
        text.textContent = 'Bookmarked';
      } else {
        btn.classList.remove('bookmarked');
        icon.className = 'fa-regular fa-bookmark';
        text.textContent = 'Bookmark';
      }
    }

    // ----------------------------------------------------
    // THEME TOGGLE
    // ----------------------------------------------------
    function setTheme(theme) {
      const htmlEl = document.documentElement;
      const themeText = document.getElementById('themeText');
      const themeIcon = document.querySelector('#themeToggle i');

      if (theme === 'light') {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        themeText.textContent = 'Light Mode';
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        themeText.textContent = 'Dark Mode';
        themeIcon.className = 'fa-solid fa-moon';
      }
      localStorage.setItem('js_theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    // ----------------------------------------------------
    // MOBILE DRAWER NAV
    // ----------------------------------------------------
    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (open) {
        sidebar.classList.add('mobile-open');
        overlay.classList.add('mobile-open');
      } else {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('mobile-open');
      }
    }

    // ----------------------------------------------------
    // CERTIFICATE GENERATOR MODAL
    // ----------------------------------------------------
    function toggleCertModal(show) {
      const modal = document.getElementById('certModal');
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    function generateCertificate() {
      const name = document.getElementById('certStudentName').value || 'Full Stack Developer';
      const printWin = window.open('', '_blank');
      const htmlContent = '<html><head><title>Certificate of Completion - ' + name + '<\/title>' +
        '<style>' +
        'body { font-family: sans-serif; text-align: center; padding: 4rem; background: #0f172a; color: #fff; }' +
        '.cert-box { border: 8px double #f7df1e; padding: 4rem; border-radius: 20px; max-width: 800px; margin: 0 auto; background: #1e293b; }' +
        'h1 { font-size: 3rem; color: #f7df1e; margin-bottom: 0.5rem; }' +
        'h2 { font-size: 2.2rem; color: #38bdf8; margin: 1.5rem 0; }' +
        'p { font-size: 1.2rem; color: #cbd5e1; }' +
        '.date { margin-top: 3rem; font-size: 1rem; color: #94a3b8; }' +
        '<\/style>' +
        '<\/head><body>' +
        '<div class="cert-box">' +
        '<h1>🏆 CERTIFICATE OF COMPLETION<\/h1>' +
        '<p>This is proudly presented to<\/p>' +
        '<h2>' + name + '<\/h2>' +
        '<p>For successfully completing all modules of<\/p>' +
        '<p style="font-size: 1.5rem; font-weight: bold; color: #4ade80;">JavaScript Mastery Course<\/p>' +
        '<div class="date">Issued by NextSem Online • ' + new Date().toLocaleDateString() + '<\/div>' +
        '<\/div><\/body><\/html>';
      printWin.document.write(htmlContent);
      printWin.document.close();
      printWin.focus();
      setTimeout(() => printWin.print(), 500);
    }
  </script>
