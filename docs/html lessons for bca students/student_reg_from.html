<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>College Student Registration Form</h1>

    <form>

        Name:
        <input type="text">

        <br><br>

        Email:
        <input type="email">

        <br><br>

        Password:
        <input type="password">

        <br><br>

        Mobile:
        <input type="number">

        <br><br>

        Date of Birth:
        <input type="date">

        <br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Laddu


        <br><br>

        Course:
        <select>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
        </select>

        <br><br>

        Hobbies:
        <input type="checkbox"> Sports
        <input type="checkbox"> Music
        <input type="checkbox"> Reading

        <br><br>

        Address:
        <br>
        <textarea rows="4" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Clear">

    </form>

</body>

</html>
