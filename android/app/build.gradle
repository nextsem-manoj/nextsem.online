apply plugin: 'com.android.application'

android {
    namespace = "online.nextsem.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "online.nextsem.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "3.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:BCA_NEW_Books:cli:html:cpp:css:js:react:nodejs:node:javascript'
        }
        aaptOptions {
            cruncherEnabled = true
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:BCA_NEW_Books:cli:html:cpp:css:js:react:nodejs:node:javascript'
        }
    }

    signingConfigs {
        release {
            storeFile file("nextsem-release-key.keystore")
            storePassword "nextsem123"
            keyAlias "nextsem-alias"
            keyPassword "nextsem123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

android.applicationVariants.all { variant ->
    tasks.register("cleanUnusedAssetsFor${variant.name.capitalize()}") {
        doLast {
            def assetsDir = variant.mergeAssetsProvider.get().outputDir.get().asFile
            delete fileTree(dir: assetsDir, includes: [
                '**/og-image.png',
                '**/icon-512x512.png',
                '**/favicon.png',
                '**/*.apk',
                '**/*.mp4',
                '**/*.webm',
                '**/youtube_banner.png',
                '**/youtube_profile_avatar.png',
                '**/manoj-kumar.jpg',
                '**/*.jpg',
                '**/*.jpeg',
                '**/*.txt',
                '**/_next/**',
                '**/BCA_NEW_Books/**',
                '**/recordings/**',
                '**/screenshots/**'
            ])

        }
    }
    variant.mergeAssetsProvider.configure {
        finalizedBy("cleanUnusedAssetsFor${variant.name.capitalize()}")
    }
}

