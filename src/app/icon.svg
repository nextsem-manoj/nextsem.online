<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#04AA6D" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Dark Rounded Rect Body -->
  <rect width="512" height="512" rx="120" fill="#080d1a" />
  <!-- Glowing Emerald Green Border -->
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#04AA6D" stroke-width="32" filter="url(#greenGlow)" />
  <!-- Bold Emerald Green NS Monogram -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="220" font-weight="900" fill="#04AA6D" text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">NS</text>
</svg>
