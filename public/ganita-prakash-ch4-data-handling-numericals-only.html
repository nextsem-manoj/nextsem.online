<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="min-h-screen flex flex-col items-center p-3 sm:p-6 selection:bg-[#04AA6D] selection:text-black">

  <!-- Header Section -->
  <header class="w-full max-w-4xl mx-auto mb-6 bg-[#0f172a] border border-slate-800 rounded-2xl p-5 emerald-glow text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="space-y-1">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#04AA6D]/15 border border-[#04AA6D]/40 text-[#04AA6D] text-xs font-black uppercase tracking-wider">
        <span>🧮 Pure Calculation & Numericals Edition • 50 Problems</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
        Data Handling Numericals <span class="text-[#04AA6D] text-lg font-bold block sm:inline">| आँकड़ों के आंकिक प्रश्न</span>

      <p class="text-xs sm:text-sm text-slate-300">NCERT Grade 6 Ganita Prakash Ch 4 • 100% Arithmetic & Problem Solving (English + हिन्दी)</p>

    <div class="flex items-center gap-2 shrink-0">
      <button id="langToggle" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs border border-slate-700 transition-all flex items-center gap-2 cursor-pointer shadow-md">
        <span>🌐 Language: <strong class="text-[#04AA6D]" id="langDisplay">Both</strong></span>
      </button>
      <button id="resetQuizBtn" class="px-3 py-2 rounded-xl bg-[#04AA6D] hover:bg-[#039861] text-black font-extrabold text-xs transition-all cursor-pointer shadow-md">

    </div>
  </header>

  <!-- Sticky Stats Bar -->
  <div class="w-full max-w-4xl mx-auto mb-6 bg-[#0f172a]/90 backdrop-blur-md border border-slate-800 rounded-xl p-4 sticky top-3 z-30 shadow-xl flex items-center justify-between gap-3 flex-wrap">

      <div class="text-xs text-slate-400">Score: <strong id="scoreCount" class="text-xl text-[#04AA6D] font-black ml-1">0</strong> / 50</div>

    <div class="w-full sm:w-64 h-2.5 bg-slate-800 rounded-full overflow-hidden">
      <div id="progressBar" class="h-full bg-[#04AA6D] transition-all duration-300 w-0"></div>

    <!-- Topic Filter Dropdown -->
    <select id="topicFilter" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-[#04AA6D]">

      <option value="1">Cat 1: Range Calculations (Max - Min)</option>
      <option value="2">Cat 2: Frequency Table Totals & Missing Values</option>
      <option value="3">Cat 3: Tally Mark Arithmetic</option>
      <option value="4">Cat 4: Pictograph Total Quantities</option>
      <option value="5">Cat 5: Pictograph Symbols Count (Total ÷ Scale)</option>

        optsEn: ["15°C (41°C - 26°C)", "13°C", "17°C", "20°C"],
        optsHi: ["15°C (41°C - 26°C)", "13°C", "17°C", "20°C"],

        optsHi: ["28", "35", "30", "31 (50 - 19)"],

    let currentLang = "both";
    let selectedAnswers = {};
    let currentTopic = "all";

    const langToggle = document.getElementById("langToggle");
    const langDisplay = document.getElementById("langDisplay");
    const topicFilter = document.getElementById("topicFilter");
    const resetQuizBtn = document.getElementById("resetQuizBtn");
    const questionsContainer = document.getElementById("questionsContainer");
    const scoreCount = document.getElementById("scoreCount");
    const answeredCount = document.getElementById("answeredCount");
    const progressBar = document.getElementById("progressBar");

    langToggle.addEventListener("click", () => {
      if (currentLang === "both") currentLang = "en";
      else if (currentLang === "en") currentLang = "hi";
      else currentLang = "both";

      langDisplay.innerText = currentLang === "both" ? "Both (द्विभाषी)" : currentLang === "en" ? "English" : "हिन्दी";
      renderQuestions();
    });

    topicFilter.addEventListener("change", (e) => {
      currentTopic = e.target.value;
      renderQuestions();
    });

    resetQuizBtn.addEventListener("click", () => {
      if (confirm("Restart numericals test and reset your score?")) {
        selectedAnswers = {};
        updateStats();
        renderQuestions();
      }
    });

    function updateStats() {
      const answeredKeys = Object.keys(selectedAnswers);
      const totalAnswered = answeredKeys.length;
      let score = 0;
      answeredKeys.forEach(idx => {
        if (selectedAnswers[idx] === QUESTIONS[idx].correct) score++;
      });

      scoreCount.innerText = score;
      answeredCount.innerText = totalAnswered;
      progressBar.style.width = `${(totalAnswered / QUESTIONS.length) * 100}%`;

      if (totalAnswered === QUESTIONS.length && score >= 40) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function handleSelectOption(qIdx, optIdx) {
      if (selectedAnswers[qIdx] !== undefined) return;
      selectedAnswers[qIdx] = optIdx;
      updateStats();
      renderQuestions();

      if (optIdx === QUESTIONS[qIdx].correct) {
        confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
      }
    }

    function renderQuestions() {
      questionsContainer.innerHTML = "";

      const filtered = QUESTIONS.map((q, idx) => ({ ...q, originalIndex: idx }))
        .filter(q => currentTopic === "all" || q.topic.toString() === currentTopic);

      filtered.forEach((q, displayIdx) => {
        const isAnswered = selectedAnswers[q.originalIndex] !== undefined;
        const userAnswer = selectedAnswers[q.originalIndex];

        const card = document.createElement("div");
        card.className = "bg-[#0f172a] border border-slate-800 rounded-2xl p-5 sm:p-6 transition-all shadow-lg text-left space-y-4";

        let qTitle = "";
        if (currentLang === "both") {
          qTitle = `<div class="font-bold text-white text-base sm:text-lg">Q${q.originalIndex + 1}. ${q.qEn}</div>
                    <div class="text-slate-300 text-sm mt-1">हिन्दी: ${q.qHi}</div>`;
        } else if (currentLang === "en") {
          qTitle = `<div class="font-bold text-white text-base sm:text-lg">Q${q.originalIndex + 1}. ${q.qEn}</div>`;
        } else {
          qTitle = `<div class="font-bold text-white text-base sm:text-lg">प्र${q.originalIndex + 1}. ${q.qHi}</div>`;
        }

        let optionsHtml = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">';
        q.optsEn.forEach((optEn, oIdx) => {
          const optHi = q.optsHi[oIdx];
          let optText = currentLang === "both" ? `${optEn}` : currentLang === "en" ? optEn : optHi;

          let btnClass = "bg-[#1e293b] hover:bg-slate-700 text-slate-200 border-slate-700";
          if (isAnswered) {
            if (oIdx === q.correct) {
              btnClass = "correct-btn font-black";
            } else if (oIdx === userAnswer && userAnswer !== q.correct) {
              btnClass = "wrong-btn";
            } else {
              btnClass = "bg-slate-900/50 text-slate-600 border-slate-800 cursor-not-allowed";
            }
          }

          optionsHtml += `
            <button onclick="handleSelectOption(${q.originalIndex}, ${oIdx})" ${isAnswered ? 'disabled' : ''} class="px-4 py-3 rounded-xl border text-xs sm:text-sm text-left transition-all flex items-center justify-between gap-2 cursor-pointer ${btnClass}">
              <span><strong class="text-[#04AA6D] mr-1.5">${String.fromCharCode(65 + oIdx)}.</strong> ${optText}</span>
              ${isAnswered && oIdx === q.correct ? '<span>✓</span>' : ''}
              ${isAnswered && oIdx === userAnswer && userAnswer !== q.correct ? '<span>✗</span>' : ''}
            </button>
          `;
        });
        optionsHtml += '</div>';

        let explanationHtml = "";
        if (isAnswered) {
          const isCorrect = userAnswer === q.correct;
          explanationHtml = `
            <div class="p-3.5 rounded-xl text-xs sm:text-sm border ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border-rose-500/30 text-rose-300'}">
              <strong>${isCorrect ? '✓ Correct Calculation!' : '✗ Calculation Error!'}</strong> Step-by-Step Solution: ${q.exp}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-[#04AA6D]">
            <span>${q.topicName}</span>
            <span>Numerical ${q.originalIndex + 1} of 50</span>
          </div>
          ${qTitle}
          ${optionsHtml}
          ${explanationHtml}
        `;

        questionsContainer.appendChild(card);
      });
    }

    renderQuestions();
    updateStats();
  </script>
