<script>
const Q=[
  {
    h:"वैश्वीकरण की सबसे उचित परिभाषा कौन सी है?",
    e:"Which best defines Globalisation?",
    o:["विभिन्न देशों के बीच वस्तुओं, विचारों, पूँजी और लोगों के तीव्र प्रवाह की प्रक्रिया","केवल आर्थिक सम्बन्धों का विस्तार","पश्चिमी संस्कृति का विश्वव्यापी प्रसार","संयुक्त राष्ट्र के माध्यम से राष्ट्रों का एकीकरण"],
    a:0,
    x:"<strong>व्याख्या:</strong> वैश्वीकरण का अर्थ है — विभिन्न देशों के बीच वस्तुओं, विचारों, पूँजी और लोगों के प्रवाह को तेज़ करने की प्रक्रिया। यह केवल आर्थिक नहीं, बल्कि सांस्कृतिक, राजनीतिक और सामाजिक भी है।<br><br><em>Explanation: Globalisation refers to the rapid flow of goods, ideas, capital and people across nations — not just economic, but also cultural, political and social.</em>"
  },
  {
    h:"वैश्वीकरण का सबसे बड़ा चालक (Driver) क्या है?",
    e:"What has primarily driven globalisation?",
    o:["सैन्य विस्तार","प्रौद्योगिकी — विशेषतः इन्टरनेट, दूरसंचार एवं परिवहन","संयुक्त राष्ट्र की नीतियाँ","परमाणु हथियार"],
    a:1,
    x:"<strong>व्याख्या:</strong> प्रौद्योगिकी — विशेषकर इन्टरनेट, दूरसंचार और परिवहन में क्रांति — वैश्वीकरण का सबसे बड़ा चालक है। इसने समय और दूरी की बाधाओं को समाप्त किया।<br><br><em>Technology — especially the internet, telecommunications and transport revolution — is the primary driver. It eliminated barriers of time and distance.</em>"
  },
  {
    h:"विश्व व्यापार संगठन (WTO) की स्थापना कब हुई?",
    e:"When was the World Trade Organisation (WTO) established?",
    o:["1947","1991","1995","2001"],
    a:2,
    x:"<strong>व्याख्या:</strong> WTO की स्थापना 1 जनवरी 1995 को हुई। यह GATT का उत्तराधिकारी है और अंतर्राष्ट्रीय व्यापार नियमों को नियंत्रित करता है।<br><br><em>WTO was established on 1 January 1995 as successor to GATT. It governs international trade rules.</em>"
  },
  {
    h:"बहुराष्ट्रीय कंपनियाँ (MNCs) विकासशील देशों के संदर्भ में आलोचना का विषय क्यों हैं?",
    e:"Why are MNCs criticised in the context of developing countries?",
    o:["वे केवल कृषि करती हैं","वे सस्ते श्रम का शोषण करती हैं, स्थानीय उद्योगों को हानि पहुँचाती हैं और मुनाफ़ा विदेश भेजती हैं","वे सेना को मज़बूत करती हैं","वे विज्ञान को बढ़ावा देती हैं"],
    a:1,
    x:"<strong>व्याख्या:</strong> MNCs की आलोचना इसलिए होती है क्योंकि वे विकासशील देशों में सस्ते श्रम का शोषण करती हैं, स्थानीय उद्योगों को नुकसान पहुँचाती हैं और मुनाफ़ा अपने मूल देश भेजती हैं।<br><br><em>MNCs exploit cheap labour, damage local industries and repatriate profits — harming developing economies.</em>"
  },
  {
    h:"वैश्वीकरण का सांस्कृतिक प्रभाव क्या है?",
    e:"What is a cultural impact of globalisation?",
    o:["सभी देशों की संस्कृति एक समान हो जाती है","केवल पश्चिमी संस्कृति फैलती है","संस्कृतियों का मिश्रण होता है — Homogenisation एवं Hybridisation दोनों","संस्कृति पर कोई प्रभाव नहीं पड़ता"],
    a:2,
    x:"<strong>व्याख्या:</strong> वैश्वीकरण से एकरूपता (Homogenisation) और संकरण (Hybridisation) दोनों होते हैं। उदाहरण: McDonald's भारत में आलू टिक्की बर्गर बेचता है — यही 'Glocal' है।<br><br><em>Globalisation causes both Homogenisation and Hybridisation. Example: McDonald's sells McAloo Tikki in India — that's 'Glocal'.</em>"
  },
  {
    h:"वैश्वीकरण विरोधी आन्दोलन में कौन सा मंच प्रमुख है?",
    e:"Which forum is prominent in anti-globalisation movements?",
    o:["NATO","World Social Forum (WSF)","OPEC","G-8"],
    a:1,
    x:"<strong>व्याख्या:</strong> World Social Forum (WSF) वैश्वीकरण विरोधी आन्दोलन का प्रमुख मंच है। यह WEF (दावोस) के विकल्प के रूप में सामाजिक न्याय और टिकाऊ विकास की वकालत करता है।<br><br><em>WSF is the key platform against corporate globalisation, advocating social justice and sustainable development as an alternative to WEF (Davos).</em>"
  },
  {
    h:"भारत ने 1991 में आर्थिक उदारीकरण की नीति क्यों अपनाई?",
    e:"Why did India adopt economic liberalisation in 1991?",
    o:["अमेरिका के दबाव में","गम्भीर विदेशी मुद्रा संकट और IMF की शर्तों के कारण","सोवियत संघ के सुझाव पर","संयुक्त राष्ट्र के आदेश से"],
    a:1,
    x:"<strong>व्याख्या:</strong> 1991 में भारत गम्भीर विदेशी मुद्रा संकट में था। IMF और विश्व बैंक की शर्तों पर ऋण लेकर LPG नीति (Liberalisation, Privatisation, Globalisation) अपनाई गई।<br><br><em>India faced a severe balance-of-payments crisis in 1991. Under IMF/World Bank conditions, India adopted the LPG policy.</em>"
  },
  {
    h:"'ब्रेटन वुड्स संस्थाएँ' (Bretton Woods Institutions) से क्या तात्पर्य है?",
    e:"What are 'Bretton Woods Institutions'?",
    o:["NATO और वार्सा संधि","अंतर्राष्ट्रीय मुद्रा कोष (IMF) और विश्व बैंक","WTO और UNCTAD","G-7 और G-20"],
    a:1,
    x:"<strong>व्याख्या:</strong> 1944 में ब्रेटन वुड्स, अमेरिका में हुए सम्मेलन में IMF और विश्व बैंक की स्थापना का निर्णय लिया गया। इन्हें ही ब्रेटन वुड्स संस्थाएँ कहते हैं।<br><br><em>At the 1944 Bretton Woods conference in USA, IMF and World Bank were established — collectively called Bretton Woods Institutions.</em>"
  },
  {
    h:"वैश्वीकरण से राज्य की सम्प्रभुता (State Sovereignty) पर क्या प्रभाव पड़ता है?",
    e:"How does globalisation affect state sovereignty?",
    o:["राज्य की शक्ति बढ़ जाती है","बहुराष्ट्रीय कंपनियाँ और अंतर्राष्ट्रीय संस्थाएँ राष्ट्रीय नीतियों को प्रभावित करती हैं, जिससे राज्य की सम्प्रभुता पर दबाव पड़ता है","राज्य की भूमिका पूर्णतः समाप्त हो जाती है","राज्य और अधिक शक्तिशाली हो जाता है"],
    a:1,
    x:"<strong>व्याख्या:</strong> वैश्वीकरण से राज्य की सम्प्रभुता पर दबाव पड़ता है — MNCs, IMF, WTO जैसी संस्थाएँ राष्ट्रीय नीतियों को प्रभावित करती हैं। हालाँकि राज्य पूर्णतः समाप्त नहीं होता।<br><br><em>Globalisation pressures state sovereignty as MNCs, IMF and WTO influence national policies — yet the state does not disappear.</em>"
  },
  {
    h:"भारत के वैश्वीकरण में सूचना प्रौद्योगिकी (IT) क्षेत्र की क्या भूमिका रही?",
    e:"What role did the IT sector play in India's globalisation?",
    o:["कोई भूमिका नहीं रही","IT ने भारत को वैश्विक IT केंद्र बनाया, बेंगलुरु जैसे शहर उभरे, विदेशी मुद्रा अर्जन बढ़ा","केवल रक्षा क्षेत्र को मज़बूत किया","कृषि का विकास किया"],
    a:1,
    x:"<strong>व्याख्या:</strong> IT क्षेत्र ने भारत को वैश्विक मानचित्र पर एक प्रमुख सेवा निर्यातक के रूप में स्थापित किया। बेंगलुरु 'भारत की सिलिकॉन वैली' बना। BPO, KPO उद्योग ने लाखों रोज़गार दिए।<br><br><em>IT established India as a global service exporter. Bangalore became 'India's Silicon Valley'. BPO and KPO industries created millions of jobs and boosted foreign exchange.</em>"
  },
  {
    h:"वैश्वीकरण के सकारात्मक प्रभावों में कौन सा शामिल है?",
    e:"Which of these is a POSITIVE effect of globalisation?",
    o:["असमानता में वृद्धि","पर्यावरण का क्षरण","प्रौद्योगिकी एवं ज्ञान का प्रसार, रोज़गार सृजन और आर्थिक विकास","सांस्कृतिक पहचान का विनाश"],
    a:2,
    x:"<strong>व्याख्या:</strong> वैश्वीकरण के सकारात्मक प्रभावों में प्रौद्योगिकी का प्रसार, रोज़गार सृजन, आर्थिक विकास, स्वास्थ्य सेवाओं तक बेहतर पहुँच और विचारों का आदान-प्रदान शामिल है।<br><br><em>Positive effects include: spread of technology, job creation, economic growth, better healthcare access and exchange of ideas.</em>"
  },
  {
    h:"भारत में विशेष आर्थिक क्षेत्र (SEZ) वैश्वीकरण से किस प्रकार सम्बन्धित हैं?",
    e:"How are SEZs related to globalisation in India?",

let sc=0,wr=0,dn=0;
function build(){
  const area=document.getElementById('qa');
  area.innerHTML='';
  const lb=['A','B','C','D'];
  Q.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='qc';d.id='qc'+i;
    d.innerHTML='<div class="qn">प्रश्न '+(i+1)+' / 20</div>'+
    '<div class="qt">'+q.h+'</div>'+
    '<div class="qe">'+q.e+'</div>'+
    '<div class="opts" id="op'+i+'">'+
    q.o.map((o,j)=>'<button class="ob" onclick="ans('+i+','+j+')" id="ob'+i+'_'+j+'"><span class="badge">'+lb[j]+'</span><span>'+o+'</span></button>').join('')+
    '</div>'+
    '<div class="exp" id="ex'+i+'">'+q.x+'</div>';
    area.appendChild(d);
  });
}
function ans(qi,oi){
  const q=Q[qi];
  document.querySelectorAll('#op'+qi+' .ob').forEach(b=>b.disabled=true);
  const sel=document.getElementById('ob'+qi+'_'+oi);
  const cor=document.getElementById('ob'+qi+'_'+q.a);
  const card=document.getElementById('qc'+qi);
  if(oi===q.a){sel.classList.add('ok');card.classList.add('ok');sc++;document.getElementById('sc').textContent=sc;}
  else{sel.classList.add('er');cor.classList.add('ok');card.classList.add('er');wr++;document.getElementById('wr').textContent=wr;}
  document.getElementById('ex'+qi).classList.add('show');
  dn++;
  document.getElementById('dn').textContent=dn+'/20';
  document.getElementById('pc').textContent=Math.round(sc/dn*100)+'%';
  document.getElementById('pb').style.width=(dn/20*100)+'%';
  if(dn===20)setTimeout(showResult,800);
}
function showResult(){
  const pct=Math.round(sc/20*100);
  document.getElementById('fs').textContent=sc+' / 20';
  let l,m;
  if(pct>=90){l='शानदार! Excellent!';m='आप इस अध्याय में पूरी तरह निपुण हैं। Board exam के लिए तैयार!';confetti({particleCount:150,spread:80,origin:{y:0.6}});}
  else if(pct>=70){l='बहुत अच्छा! Very Good!';m='अच्छा प्रदर्शन! थोड़ी और अभ्यास से आप पूर्ण निपुण बन सकते हैं।';}
  else if(pct>=50){l='ठीक है! Keep Going!';m='कुछ अवधारणाएँ दोबारा पढ़ें। NCERT अध्याय 7 को ध्यानपूर्वक पढ़ें।';}
  else{l='प्रयास जारी रखें!';m='चिंता न करें! वैश्वीकरण अध्याय दोबारा पढ़ें और पुनः प्रयास करें।';}
  document.getElementById('fl').textContent=l;
  document.getElementById('fm').textContent=m;
  const rp=document.getElementById('rp');
  rp.classList.add('show');
  rp.scrollIntoView({behavior:'smooth',block:'center'});
}
function retry(){
  sc=0;wr=0;dn=0;
  document.getElementById('sc').textContent='0';
  document.getElementById('wr').textContent='0';
  document.getElementById('dn').textContent='0/20';
  document.getElementById('pc').textContent='0%';
  document.getElementById('pb').style.width='0%';
  document.getElementById('rp').classList.remove('show');
  build();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleTheme(){
  const lt=document.body.classList.toggle('lt');
  document.getElementById('themeBtn').textContent=lt?'🌙 Dark':'☀️ Light';
  localStorage.setItem('nxt-theme',lt?'light':'dark');
}
if(localStorage.getItem('nxt-theme')==='light'){document.body.classList.add('lt');document.getElementById('themeBtn').textContent='🌙 Dark';}
build();
</script>
