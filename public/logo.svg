<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#04AA6D" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Logo Mark Box -->
  <rect x="4" y="6" width="48" height="48" rx="12" fill="#0c1328" stroke="#04AA6D" stroke-width="2" filter="url(#glow)" />
  
  <!-- N (Emerald Green) -->
  <path d="M 16 42 V 18 L 29 42 V 18" fill="none" stroke="#04AA6D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- S (Crisp Pure White) -->
  <path d="M 44 24 C 44 19, 32 19, 32 26 C 32 32, 44 32, 44 38 C 44 43, 32 43, 32 38" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- Main Brand Text (NEXTSEM.ONLINE) -->
  <text x="62" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">NEXTSEM<tspan fill="#04AA6D" font-size="16" font-weight="700">.ONLINE</tspan></text>

  <!-- Tagline: FULL STACK WEB DEVELOPER -->
  <text x="63" y="45" fill="#04AA6D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace" font-size="8.5" font-weight="800" letter-spacing="1.2">FULL STACK WEB DEVELOPER</text>
</svg>
