<body>

  <div class="container">
    <div class="hero-card">
      <span class="badge-pill">NCERT CLASS 4 MATHS MELA • CHAPTER 6</span>
      <h1>Measuring is Fun (माप और खेल)</h1>
      <p style="color: var(--text-muted)">Discover Lengths, Metres, Long Jumps, and Real-World Comparisons</p>
      
      <div class="score-card">
        <div><div class="score-num" id="correctScore">0</div><div class="score-lbl">Correct</div></div>
        <div><div class="score-num" id="totalAttempted">0 / 8</div><div class="score-lbl">Completed</div></div>
        <div><div class="score-num" id="accuracy">0%</div><div class="score-lbl">Accuracy</div></div>
      </div>
    </div>

    <div id="questionsContainer"></div>
  </div>

  <script>
    const questions = [
      {
        q: "1. 1 metre is equal to how many centimetres? (1 मीटर कितने सेंटीमीटर के बराबर होता है?)",
        opts: ["10 cm", "100 cm", "1,000 cm", "50 cm"],
        ans: 1,
        exp: "1 metre (m) = 100 centimetres (cm). 100 cm make 1 full metre."
      },
      {
        q: "2. The length of a standard cricket bat is closest to which of these? (एक क्रिकेट बैट की लंबाई लगभग किसके बराबर होती है?)",
        opts: ["About 1 metre", "About 5 metres", "About 10 cm", "About 20 metres"],
        ans: 0,
        exp: "A standard cricket bat length is approximately 1 metre (around 96 cm to 100 cm)."
      },
      {
        q: "3. If a city bus is about 10 metres long and a blue whale is about 30 metres long, how many buses equal the length of one whale? (यदि एक बस 10 मीटर लंबी है और व्हेल 30 मीटर, तो कितनी बसें एक व्हेल के बराबर होंगी?)",
        opts: ["2 buses", "3 buses", "4 buses", "5 buses"],
        ans: 1,
        exp: "30 metres / 10 metres = 3 buses. 3 buses lined up equal 1 blue whale!"
      },
      {
        q: "4. In a school sports long jump, Rohan jumped 1 m 40 cm and Kabir jumped 1 m 15 cm. Who jumped farther and by how much?",
        opts: ["Rohan by 25 cm", "Kabir by 25 cm", "Rohan by 15 cm", "Both jumped equal"],
        ans: 0,
        exp: "140 cm - 115 cm = 25 cm. Rohan jumped 25 cm farther than Kabir."
      },
      {
        q: "5. Which tool would you use to measure the height of a classroom door accurately? (कक्षा के दरवाजे की ऊंचाई मापने के लिए क्या इस्तेमाल करेंगे?)",
        opts: ["A 15 cm small ruler", "A measuring tape (मीटर टेप)", "A coin", "An eraser"],
        ans: 1,
        exp: "A measuring tape (or metre scale) is the standard and most convenient tool to measure large vertical heights like a door."
      },
      {
        q: "6. If 4 children hold hands and each arm-span is about 1 metre, what is their total combined span? (4 बच्चों का कुल फैलाव कितना होगा?)",
        opts: ["2 metres", "4 metres", "8 metres", "10 metres"],
        ans: 1,
        exp: "4 children × 1 metre each = 4 metres."
      },
      {
        q: "7. How many 50 cm ropes are needed to make a 2-metre long rope? (2 मीटर लंबी रस्सी बनाने के लिए 50 सेमी की कितनी रस्सियां चाहिए?)",
        opts: ["2 ropes", "4 ropes", "6 ropes", "8 ropes"],
        ans: 1,
        exp: "2 metres = 200 cm. 200 cm / 50 cm = 4 ropes."
      },
      {
        q: "8. Words like tall, wide, short, depth, and distance all describe which physical quantity? (लंबा, चौड़ा, गहरा, दूरी ये सब किस भौतिक राशि को दर्शाते हैं?)",
        opts: ["Weight (वजन)", "Length / Distance (लंबाई / दूरी)", "Capacity (धारिता)", "Time (समय)"],
        ans: 1,
        exp: "As highlighted in the NCERT teacher notes, tall, wide, short, depth, breadth, and height all refer to length and distance measurements in different orientations."
      }
    ];

    let correctCount = 0;
    let answeredSet = new Set();

    function renderQuestions() {
      const c = document.getElementById('questionsContainer');
      c.innerHTML = '';
      questions.forEach((item, idx) => {
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = 'qc_' + idx;

        const qNum = document.createElement('div');
        qNum.className = 'q-num';
        qNum.innerText = 'ACTIVITY ' + (idx + 1) + ' OF ' + questions.length;

        const qText = document.createElement('div');
        qText.className = 'q-text';
        qText.innerText = item.q;

        const optGrid = document.createElement('div');
        optGrid.className = 'opt-grid';

        item.opts.forEach((opt, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = '<span>' + String.fromCharCode(65 + optIdx) + '. ' + opt + '</span>';
          btn.onclick = () => checkAnswer(idx, optIdx, btn);
          optGrid.appendChild(btn);
        });

        const exp = document.createElement('div');
        exp.className = 'explanation';
        exp.id = 'exp_' + idx;
        exp.innerHTML = '<strong>💡 Solution (समाधान):</strong><br>' + item.exp;

        qCard.appendChild(qNum);
        qCard.appendChild(qText);
        qCard.appendChild(optGrid);
        qCard.appendChild(exp);
        c.appendChild(qCard);
      });
    }

    function checkAnswer(qIdx, optIdx, btn) {
      if (answeredSet.has(qIdx)) return;
      answeredSet.add(qIdx);

      const qCard = document.getElementById('qc_' + qIdx);
      const allBtns = qCard.querySelectorAll('.opt-btn');
      const correctIdx = questions[qIdx].ans;
      const exp = document.getElementById('exp_' + qIdx);

      if (optIdx === correctIdx) {
        btn.classList.add('correct');
        btn.innerHTML += ' <span>✓ Correct!</span>';
        correctCount++;
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
      } else {
        btn.classList.add('wrong');
        btn.innerHTML += ' <span>✗ Your Choice</span>';
        allBtns[correctIdx].classList.add('correct');
        allBtns[correctIdx].innerHTML += ' <span>✓ Correct Answer</span>';
      }

      exp.style.display = 'block';
      document.getElementById('correctScore').innerText = correctCount;
      document.getElementById('totalAttempted').innerText = answeredSet.size + ' / ' + questions.length;
      document.getElementById('accuracy').innerText = Math.round((correctCount / answeredSet.size) * 100) + '%';
    }

    renderQuestions();
  </script>
</body>
